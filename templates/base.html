<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FASTENPRO AI — Fastener Manufacturing Intelligence{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand-section">
        <div class="brand-logo-icon">⚡</div>
        <div>
          <div class="brand-title">FASTENPRO AI</div>
          <div class="brand-subtitle">Manufacturing Intelligence</div>
        </div>
      </div>

      <nav class="nav-menu">
        <a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" id="nav-dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span>Dashboard</span>
        </a>
        <a href="/batches" class="nav-link {% if active_page == 'batches' %}active{% endif %}" id="nav-batches">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
          <span>Batches</span>
        </a>
        <a href="/production" class="nav-link {% if active_page == 'production' %}active{% endif %}" id="nav-production">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
          <span>Production</span>
        </a>
        <a href="/quality" class="nav-link {% if active_page == 'quality' %}active{% endif %}" id="nav-quality">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><polyline points="9 12 11 14 15 10"></polyline></svg>
          <span>Quality</span>
        </a>
        <a href="/ai" class="nav-link {% if active_page == 'ai' %}active{% endif %}" id="nav-ai">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2a10 10 0 1 0 10 10H12V2z"></path><path d="M12 12L2.1 12.5"></path><path d="M16 16l4.5 4.5"></path></svg>
          <span>AI Copilot</span>
          <span class="nav-badge">OLLAMA</span>
        </a>
        <a href="/reports" class="nav-link {% if active_page == 'reports' %}active{% endif %}" id="nav-reports">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          <span>Reports</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="ollama-status-card" id="db-status-card" style="margin-bottom: 0.5rem;">
          <div style="display:flex; align-items:center;">
            <span class="status-indicator online" id="db-status-indicator"></span>
            <span id="db-status-text">Database Connected</span>
          </div>
        </div>
        <div class="ollama-status-card" id="ollama-card">
          <div style="display:flex; align-items:center;">
            <span class="status-indicator online" id="ollama-status-indicator"></span>
            <span id="ollama-status-text">Checking AI...</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Topbar -->
      <header class="topbar">
        <button class="mobile-menu-toggle" id="mobile-menu-btn" aria-label="Toggle Navigation">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>

        <form class="topbar-search" id="header-search-form">
          <span class="search-icon-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </span>
          <input type="text" class="search-input" id="header-search-input" placeholder="Enter Batch Number (e.g. BATCH-0001)" autocomplete="off">
          <span class="search-hint">↵ Enter</span>
        </form>

        <div class="topbar-actions">
          <a href="/ai" class="quick-action-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            <span>Ask AI Copilot</span>
          </a>
        </div>
      </header>

      <!-- Content Body -->
      <main class="content-body">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <!-- Floating AI Copilot Trigger -->
  <a href="/ai" class="floating-ai-trigger" title="Open AI Copilot" id="floating-ai-btn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
  </a>

  <!-- Toast Notifications Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
